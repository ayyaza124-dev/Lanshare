name: Build LANShare apps

on:
  workflow_dispatch:
  push:

jobs:
  windows:
    name: Windows app (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build LANShare.exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name LANShare windows_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: LANShare-Windows
          path: dist/LANShare.exe

  android:
    name: Android app (.apk)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev build-essential ccache
      - name: Cache Android build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Install buildozer
        run: pip install buildozer "cython<3" virtualenv setuptools
      - name: Build APK (first run takes 30-40 minutes)
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: LANShare-Android
          path: bin/*.apk
